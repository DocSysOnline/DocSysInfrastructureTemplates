parameters:
- name: environment
  type: string
- name: domain
  type: string
  default: ''
- name: serverNames
  type: string
- name: components
  type: object
  default: []
- name: iisSiteFolderPrefix
  type: string
- name: iisSiteName
  type: string
- name: applicationPools
  type: object
  default: []
- name: dependsOnList
  type: object
  default: []
- name: AccountType
  type: string
  default: UserAccount
  values:  # Allowed values for 'accountType'
  - ServiceAccount  
  - UserAccount  

jobs:
- deployment: ClearTemporaryFilesAndStartAppPoolsForMultipleComponents
  displayName: "Clear temporary files and start apppools for multiple Components"
  dependsOn: 
  - ${{ each dependsOn in parameters.dependsOnList }}:
    - ${{ dependsOn }}
  workspace:
    clean: all
  environment: ${{ coalesce(parameters.domain, parameters.environment) }}
  strategy:
    runOnce:
      deploy:
        steps:
        - download: current
          displayName: 'Download scripts'
          artifact: scripts
        - template: Execute-Powershell-Remote.yml
          parameters:
            DisplayName: "Clear Temporary ASP.Net files cache on ${{ parameters.environment }} server"
            ServersList: ${{ parameters.serverNames }}
            AccountType: ${{ parameters.AccountType }}
            ScriptType: FilePath
            ScriptPath: ${{ parameters.iisSiteFolderPrefix }}/Scripts/FDDG/ClearTemporaryASPNetFilesForIISSite.ps1
            ScriptArguments: '-iisSiteName ${{ parameters.iisSiteName }}'
        - template: Execute-Powershell-Remote.yml
          parameters:
            DisplayName: "Clear temporary plugin files on ${{ parameters.environment }} server"
            ServersList: ${{ parameters.serverNames }}
            AccountType: ${{ parameters.AccountType }}
            ScriptType: FilePath
            ScriptPath: ${{ parameters.iisSiteFolderPrefix }}/Scripts/FDDG/ClearTemporaryPluginFiles.ps1
        - ${{ each applicationPool in parameters.applicationPools }}:            
          - template: Execute-Powershell-Remote.yml
            parameters:
              DisplayName: "Start IIS application pool ${{ applicationPool }} on ${{ parameters.environment }} server"
              ServersList: ${{ parameters.serverNames }}
              AccountType: ${{ parameters.AccountType }}
              ScriptType: Inline
              InlineScript: "Start-WebAppPool ${{ applicationPool }}"