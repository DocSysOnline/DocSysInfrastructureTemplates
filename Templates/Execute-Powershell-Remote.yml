parameters:
- name: DisplayName
  type: string
- name: Targets
  type: string
- name: AccountType
  type: string
  values:  # Allowed values for 'accountType'
  - ServiceAccount  
  - UserAccount  
- name: ScriptType
  type: string
  values:  # Allowed values for 'ScriptType'
  - Inline  
  - FilePath    
- name: InlineScript
  type: object
- name: ScriptPath
  type: string
  default: ''
- name: ScriptArguments
  type: string
  default: ''

steps:
- task: PowerShell@2
  displayName: ${{ parameters.DisplayName }}
  inputs:
    pwsh: true
    targetType: filePath
    filePath: $(Pipeline.Workspace)\Scripts\Execute-PowerShellRemote.ps1
    workingDirectory: "$(Pipeline.Workspace)"
    arguments: '-targets ${{ parameters.Targets }} -accountType ${{ parameters.AccountType }} -username $(DeployUserName) -password $(DeployUserPassword) -scriptType ${{ parameters.ScriptType }} -inlineScript ${{ parameters.InlineScript.Script }} -scriptPath ${{ parameters.ScriptPath }} -scriptArguments ${{ parameters.ScriptArguments }}'